version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: goalrush-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: goalrush
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: goalrush-backend
    ports:
      - "4000:4000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/goalrush?schema=public
      PORT: 4000
      SOFASCORE_API_URL: ""
      SOFASCORE_API_KEY: ""
      OPENAI_API_KEY: ""

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goalrush-frontend
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/goalrush?schema=public
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000

volumes:
  pgdata:
