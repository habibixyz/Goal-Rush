version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: goalrush-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: goalrush
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: goalrush-redis
    ports:
      - "6379:6379"

  collector:
    build:
      context: ./collector
    container_name: goalrush-collector
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/goalrush?schema=public
      REDIS_URL: redis://redis:6379
      SOFASCORE_API_URL: ""
      SOFASCORE_API_KEY: ""

  socket:
    build:
      context: ./socket
    container_name: goalrush-socket
    ports:
      - "4000:4000"
    depends_on:
      - redis
    environment:
      PORT: 4000
      REDIS_URL: redis://redis:6379

  ai:
    build:
      context: ./ai
    container_name: goalrush-ai
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/goalrush?schema=public
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ""

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goalrush-frontend
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/goalrush?schema=public
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000

volumes:
  pgdata:
